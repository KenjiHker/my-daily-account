                let targetTotalCoins = 0; if (globalTotalIncome >= 1) { targetTotalCoins = 1 + Math.floor((Math.min(globalTotalIncome, 80000) - 1) / 1000); }
                let colCounts = new Array(colDefs.length).fill(0); let allocated = 0; let availableCols = Array.from({length: colDefs.length}, (_, i) => i);
                
                while (allocated < targetTotalCoins && availableCols.length > 0) {

                            coinCtx.fillStyle = '#d99e14'; coinCtx.fill(); coinCtx.lineWidth = 1.8; coinCtx.strokeStyle = strokeColor; coinCtx.stroke();
                            
                            coinCtx.beginPath(); coinCtx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, 2 * Math.PI); coinCtx.fillStyle = '#ffc44d'; coinCtx.fill(); coinCtx.stroke();
                            coinCtx.beginPath(); coinCtx.ellipse(c.x, c.y, c.w / 3.8, c.h / 3.8, 0, 0, 2 * Math.PI); coinCtx.strokeStyle = 'rgba(217, 158, 20, 0.85)'; coinCtx.lineWidth = 1.2; coinCtx.stroke();
                            coinCtx.restore();
                        });
                    });
                }
                shineX += 1.8; if (shineX > coinCanvas.width + 100) shineX = -60; 
                coinCtx.save(); coinCtx.globalCompositeOperation = 'source-atop'; coinCtx.beginPath(); coinCtx.moveTo(shineX, 0); coinCtx.lineTo(shineX + 35, 0);
                coinCtx.lineTo(shineX - 25, coinCanvas.height); coinCtx.lineTo(shineX - 60, coinCanvas.height); coinCtx.closePath();
                coinCtx.fillStyle = 'rgba(255, 255, 255, 0.45)'; coinCtx.fill(); coinCtx.restore();
                requestAnimationFrame(updateAndRenderCoins);
            }
            requestAnimationFrame(updateAndRenderCoins);
        }

        function openDeleteModal(id) { pendingDeleteId = id; document.getElementById('deleteConfirmModal').classList.add('active'); }
        function closeDeleteModal() { pendingDeleteId = null; document.getElementById('deleteConfirmModal').classList.remove('active'); }
        function executeDeleteRecord() {
            if (pendingDeleteId) {
                records = records.filter(r => r.id !== pendingDeleteId);
                if (window.saveToFirebase) window.saveToFirebase(records);
                closeDeleteModal(); closeRecordModal();
            }
        }

        function openCalendarModal() { displayYear = currentSelectedYear; displayMonth = currentSelectedMonth; document.getElementById('calendarModal').classList.add('active'); renderGridCalendar(); renderModalDateRecords(); }
        function closeCalendarModal(e) { if (e === null || e.target === document.getElementById('calendarModal')) document.getElementById('calendarModal').classList.remove('active'); }
        function adjustCalendarMonth(delta) { displayMonth += delta; if (displayMonth < 0) { displayMonth = 11; displayYear--; } if (displayMonth > 11) { displayMonth = 0; displayYear++; } renderGridCalendar(); }

        function renderGridCalendar() {
            document.getElementById('cal-month-title').innerText = `${displayYear}年 ${(displayMonth + 1).toString().padStart(2, '0')}月`;
            const gridContainer = document.getElementById('calendar-grid-container'); gridContainer.innerHTML = '';
            const weeks = ['一', '二', '三', '四', '五', '六', '日'];
            weeks.forEach(w => { const el = document.createElement('div'); el.className = 'cal-week-title'; el.innerText = w; gridContainer.appendChild(el); });

            const firstDay = new Date(displayYear, displayMonth, 1); let firstDayOfWeek = firstDay.getDay(); firstDayOfWeek = (firstDayOfWeek === 0) ? 6 : firstDayOfWeek - 1;
            const prevLastDate = new Date(displayYear, displayMonth, 0).getDate();
            for (let i = firstDayOfWeek - 1; i >= 0; i--) { createDayCell(displayMonth === 0 ? displayYear - 1 : displayYear, displayMonth === 0 ? 11 : displayMonth - 1, prevLastDate - i, true, gridContainer); }
            const currLastDate = new Date(displayYear, displayMonth + 1, 0).getDate();
            for (let d = 1; d <= currLastDate; d++) { createDayCell(displayYear, displayMonth, d, false, gridContainer); }
            const totalCells = firstDayOfWeek + currLastDate; const remaining = (7 - (totalCells % 7)) % 7;
            for (let nextD = 1; nextD <= remaining; nextD++) { createDayCell(displayMonth === 11 ? displayYear + 1 : displayYear, displayMonth === 11 ? 0 : displayMonth + 1, nextD, true, gridContainer); }
        }

        function createDayCell(year, month, day, isBlur, container) {
            const cellDateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
            const cell = document.createElement('div'); cell.className = 'cal-day'; cell.innerText = day;
            if (isBlur) cell.classList.add('blur-day');
            if (cellDateStr === new Date().toISOString().split('T')[0]) cell.classList.add('today-circle');
            if (cellDateStr === selectedDateStr) { cell.classList.remove('today-circle'); cell.classList.add('selected-circle'); }
            if (records.some(r => r.date === cellDateStr)) { const dot = document.createElement('div'); dot.className = 'day-dot'; cell.appendChild(dot); }
            cell.onclick = function() { selectedDateStr = cellDateStr; document.getElementById('selected-date-label').innerText = `📍 選定日期：${selectedDateStr}`; renderGridCalendar(); renderModalDateRecords(); };
            container.appendChild(cell);
        }

        function renderModalDateRecords() {
            const container = document.getElementById('modal-date-records'); container.innerHTML = '';
            const dayRecords = records.filter(r => r.date === selectedDateStr);
            if (dayRecords.length === 0) { container.innerHTML = `<div style="text-align:center; padding:18px; font-size:13px; color:#bbb;">📍 該日尚無收支明細</div>`; return; }
            dayRecords.forEach(item => {
                const itemDiv = document.createElement('div'); itemDiv.className = 'history-item'; itemDiv.style.cssText = 'border: 1.5px solid #222; border-radius:12px; margin-bottom:8px; box-shadow:0 3px 0 #222;';
                itemDiv.onclick = () => openRecordModal(item.id);
                const icon = item.category.split(' ')[0] || '📝'; const name = item.category.substring(icon.length).trim() || item.category;
                
                itemDiv.innerHTML = `
                    <div class="item-left">
                        <div class="item-icon" style="width:30px; height:30px; font-size:14px;">${icon}</div>
                        <div class="item-info"><span class="item-category" style="font-size:13px;">${name}</span></div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-weight:bold; font-size:14px; color:${item.type==='income'?'var(--income-color)':'var(--expense-color)'}">
                            ${item.type==='income'?'+':'-'}$${item.amount.toLocaleString()}
                        </span>
                        <button class="list-action-delete-btn" style="min-height:28px; padding:4px 8px;" onclick="event.stopPropagation(); openDeleteModal(${item.id})">刪除</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function executeAdd(amount, category, date, diary, forcedType) {
            const newR = { id: Date.now(), type: forcedType, amount: amount, category: category, date: date, diary: diary };
            records.unshift(newR); 
            if (window.saveToFirebase) window.saveToFirebase(records);
            const recordDate = new Date(date); currentSelectedYear = recordDate.getFullYear(); currentSelectedMonth = recordDate.getMonth();
            viewMode = 'month';
        }

        function openMonthModal() { document.getElementById('monthModal').classList.add('active'); renderMonthButtonsGrid(); }
        function closeMonthModal(e) { if (e === null || e.target === document.getElementById('monthModal')) document.getElementById('monthModal').classList.remove('active'); }
        function renderMonthButtonsGrid() {
            const container = document.getElementById('month-buttons-target'); container.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const btn = document.createElement('button'); btn.className = `month-cell-btn ${m === currentSelectedMonth ? 'active' : ''}`; btn.innerText = `${m + 1} 月`;
                btn.onclick = function() { currentSelectedMonth = m; viewMode = 'month'; syncHeaderDisplay(); closeMonthModal(null); };
                container.appendChild(btn);
            }
        }

        function toggleTheme() { 
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light'; const targetTheme = currentTheme === 'dark' ? 'light' : 'dark'; 
            document.documentElement.setAttribute('data-theme', targetTheme); localStorage.setItem('apple-app-theme', targetTheme); 
            const metaTheme = document.getElementById('theme-color-meta'); if (metaTheme) metaTheme.setAttribute('content', targetTheme === 'dark' ? '#121212' : '#f5f8fa');
            updateThemeButtonIcon(); updateDashboard(); 
        }
        function updateThemeButtonIcon() { const theme = document.documentElement.getAttribute('data-theme') || 'light'; document.getElementById('theme-btn').innerText = theme === 'light' ? '☀️' : '🌙'; }
        function buildEmojiPickerGrid() { const container = document.getElementById('emoji-grid-target'); container.innerHTML = ''; monsterEmojiList.forEach(emoji => { const item = document.createElement('div'); item.className = 'emoji-item'; item.innerText = emoji; item.onclick = function() { selectEmoji(emoji); }; container.appendChild(item); }); }
        
        let currentActiveIconSource = 'record';
        function openEmojiPicker(source) { currentActiveIconSource = source; document.getElementById('emojiModal').classList.add('active'); }
        function closeEmojiModal() { document.getElementById('emojiModal').classList.remove('active'); }
        function selectEmoji(emoji) { 
            if (currentActiveIconSource === 'modal') { selectedCustomIconModal = emoji; document.getElementById('custom-icon-preview-modal').innerText = emoji; } 
            else if (currentActiveIconSource === 'record') { selectedCustomIconRecord = emoji; recordState.category = `${emoji} 其他`; renderRecordCategories(); }
            closeEmojiModal(); 
        }

        function initDragHandle() {
            const dragArea = document.getElementById('calc-drag-area'); const bottomArea = document.querySelector('.record-bottom-calc-area');
            let startY = 0, currentY = 0, isDragging = false, startTransform = 0;
            dragArea.addEventListener('touchstart', e => { startY = e.touches[0].clientY; currentY = startY; isDragging = true; bottomArea.style.transition = 'none'; const isCollapsed = bottomArea.classList.contains('collapsed'); startTransform = isCollapsed ? (bottomArea.offsetHeight - 96) : 0; }, {passive:true});
            dragArea.addEventListener('touchmove', e => { if(!isDragging) return; currentY = e.touches[0].clientY; let deltaY = currentY - startY; let newTranslate = startTransform + deltaY; const maxTranslate = bottomArea.offsetHeight - 96; if(newTranslate < 0) newTranslate = 0; if(newTranslate > maxTranslate) newTranslate = maxTranslate; bottomArea.style.transform = `translateY(${newTranslate}px)`; }, {passive:true});
            dragArea.addEventListener('touchend', e => { if(!isDragging) return; isDragging = false; bottomArea.style.transition = ''; bottomArea.style.transform = ''; let deltaY = currentY - startY; if (Math.abs(deltaY) > 30) { if (deltaY > 0) bottomArea.classList.add('collapsed'); else bottomArea.classList.remove('collapsed'); } });
            dragArea.addEventListener('click', () => { bottomArea.style.transition = ''; bottomArea.style.transform = ''; bottomArea.classList.toggle('collapsed'); });
        }

        function toggleCalcDrawer(forceState) {
            const area = document.querySelector('.record-bottom-calc-area'); area.style.transition = ''; area.style.transform = '';
            if(forceState === 'collapse') area.classList.add('collapsed'); else if (forceState === 'expand') area.classList.remove('collapsed'); else area.classList.toggle('collapsed');
        }

        function openAddModal() {
            recordState.mode = 'add'; recordState.id = Date.now(); recordState.type = 'expense'; recordState.category = categories['expense'][0]; recordState.date = new Date(selectedDateStr || new Date().toISOString().split('T')[0]); recordState.expression = ''; recordState.amount = 0; recordState.diary = '';
            document.getElementById('record-modal-title').innerText = '新增帳目'; document.getElementById('record-delete-btn').style.display = 'none'; document.getElementById('record-diary').value = ''; document.getElementById('record-amount').innerText = '0';
            setRecordType('expense', true); updateRecordDateDisplay(); toggleCalcDrawer('expand'); document.getElementById('recordModal').classList.add('active');
        }

        function openRecordModal(id) {
            const record = records.find(r => r.id === id); if (!record) return;
            recordState.mode = 'edit'; recordState.id = record.id; recordState.type = record.type; recordState.category = record.category; recordState.date = new Date(record.date); recordState.expression = ''; recordState.amount = record.amount; recordState.diary = record.diary || '';
            if (recordState.category.includes('其他')) { selectedCustomIconRecord = recordState.category.split(' ')[0] || '🎨'; }
            document.getElementById('record-modal-title').innerText = '修改帳目'; document.getElementById('record-delete-btn').style.display = 'block'; document.getElementById('record-diary').value = recordState.diary; document.getElementById('record-amount').innerText = recordState.amount;
            setRecordType(recordState.type, false); updateRecordDateDisplay(); toggleCalcDrawer('expand'); document.getElementById('recordModal').classList.add('active');
        }

        function closeRecordModal() { document.getElementById('recordModal').classList.remove('active'); }

        function setRecordType(type, resetCat = true) {
            recordState.type = type; document.getElementById('record-type-exp').classList.toggle('active', type === 'expense'); document.getElementById('record-type-inc').classList.toggle('active', type === 'income');
            if (resetCat && categories[type].length > 0) { recordState.category = categories[type][0]; } renderRecordCategories();
        }

        function renderRecordCategories() {
            const grid = document.getElementById('record-cat-grid'); grid.innerHTML = '';
            categories[recordState.type].forEach(cat => {
                const isOther = cat.includes('其他'); let isMatch = false;
                if (isOther && recordState.category.includes('其他')) isMatch = true; else if (!isOther && recordState.category === cat) isMatch = true;
                const icon = isOther ? (isMatch ? recordState.category.split(' ')[0] : '🎨') : (cat.split(' ')[0] || '📝'); const name = isOther ? '自訂其他' : (cat.substring(icon.length).trim() || cat);
                const div = document.createElement('div'); div.className = `record-cat-item ${isMatch ? 'active' : ''}`;
                div.onclick = () => { recordState.category = cat; if (isOther) openEmojiPicker('record'); else renderRecordCategories(); };
                div.innerHTML = `<div class="record-cat-icon">${icon}</div><span>${name}</span>`; grid.appendChild(div);
            });
        }

        function updateRecordDateDisplay() {
            const year = recordState.date.getFullYear(); const month = String(recordState.date.getMonth() + 1).padStart(2, '0'); const day = String(recordState.date.getDate()).padStart(2, '0'); const dateStr = `${year}-${month}-${day}`; document.getElementById('record-date-display').innerText = dateStr;
            const today = new Date(); const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`; const badge = document.getElementById('record-date-today-badge');
            if (dateStr === todayStr) { badge.style.display = 'inline-block'; } else { badge.style.display = 'none'; }
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']; document.getElementById('record-date-weekday').innerText = weekDays[recordState.date.getDay()];
        }

        function adjustRecordDate(days) { recordState.date.setDate(recordState.date.getDate() + days); updateRecordDateDisplay(); }
        function promptDeleteRecord() { openDeleteModal(recordState.id); }

        function pressRecordCalc(val) {
            const mainDisp = document.getElementById('record-amount'); const ops = ['+', '-', '×', '÷'];
            if (val === 'C') { recordState.expression = ''; mainDisp.innerText = '0'; } 
            else if (val === 'BACK') {
                if (recordState.expression.length > 0) { recordState.expression = recordState.expression.slice(0, -1); } else { let amtStr = mainDisp.innerText.toString(); if (amtStr.length > 1) { mainDisp.innerText = amtStr.slice(0, -1); } else { mainDisp.innerText = '0'; } }
                if (recordState.expression) { try { let s = recordState.expression.replace(/×/g, '*').replace(/÷/g, '/'); if (ops.includes(recordState.expression.slice(-1))) s = s.slice(0, -1); if (s) mainDisp.innerText = Math.round(eval(s) * 100) / 100; } catch(e) {} } else if (mainDisp.innerText === '') { mainDisp.innerText = '0'; }
            } else if (val === 'OK') {
                let finalAmt = parseFloat(mainDisp.innerText);
                if (recordState.expression) { try { let s = recordState.expression.replace(/×/g, '*').replace(/÷/g, '/'); let f = eval(s); if (!isNaN(f) && isFinite(f)) finalAmt = f; } catch (e) {} }
                finalAmt = Math.round(finalAmt * 100) / 100; if (finalAmt <= 0) { alert('請輸入有效金額！'); return; }
                const year = recordState.date.getFullYear(); const month = String(recordState.date.getMonth() + 1).padStart(2, '0'); const day = String(recordState.date.getDate()).padStart(2, '0'); const dateStr = `${year}-${month}-${day}`; const newDiary = document.getElementById('record-diary').value.trim();
                
                if (recordState.mode === 'add') {
                    executeAdd(finalAmt, recordState.category, dateStr, newDiary, recordState.type);
                } else {
                    const index = records.findIndex(r => r.id === recordState.id);
                    if (index !== -1) {
                        records[index] = { id: recordState.id, type: recordState.type, amount: finalAmt, category: recordState.category, date: dateStr, diary: newDiary };
                        if (window.saveToFirebase) window.saveToFirebase(records);
                        currentSelectedYear = year; currentSelectedMonth = recordState.date.getMonth(); viewMode = 'month';
                    }
                }
                closeRecordModal();
            } else {
                if (recordState.expression === '' && !ops.includes(val) && mainDisp.innerText !== '0') { mainDisp.innerText = '0'; }
                const last = recordState.expression.slice(-1); if (ops.includes(val) && ops.includes(last)) { recordState.expression = recordState.expression.slice(0, -1) + val; } else { recordState.expression += val; }
                try { let s = recordState.expression.replace(/×/g, '*').replace(/÷/g, '/'); if (ops.includes(val)) s = s.slice(0, -1); let v = eval(s); if (v !== undefined) mainDisp.innerText = Math.round(v * 100) / 100; } catch(e) {}
            }
        }

        function renderHistory() {
            const listContainer = document.getElementById('history-list'); listContainer.innerHTML = '';
            const prefix = `${currentSelectedYear}-${(currentSelectedMonth + 1).toString().padStart(2, '0')}`;
            const filteredRecords = records.filter(r => viewMode === 'all' || r.date.startsWith(prefix));

            if (filteredRecords.length === 0) {
                listContainer.innerHTML = `<div class="empty-state-wrapper"><div class="empty-text-main">沒有記錄</div><div class="empty-text-sub" style="font-size:13px; color:#aaa; margin-top:2px;">點擊 ＋ 號新增一筆</div></div>`; return;
            }

            const groupedRecords = {}; filteredRecords.forEach(r => { if (!groupedRecords[r.date]) groupedRecords[r.date] = []; groupedRecords[r.date].push(r); });

            Object.keys(groupedRecords).sort((a, b) => new Date(b) - new Date(a)).forEach(dateStr => {
                const dayRecords = groupedRecords[dateStr]; const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']; const dayOfWeekStr = weekDays[new Date(dateStr).getDay()];
                const dateGroupDiv = document.createElement('div'); dateGroupDiv.className = 'date-group';
                let daySum = 0; dayRecords.forEach(dr => { daySum += dr.amount; });
                const headerDiv = document.createElement('div'); headerDiv.className = 'date-header'; headerDiv.innerHTML = `<span>${dateStr.replace(/-/g, '/')} ${dayOfWeekStr}</span><span class="date-summary-total">$${daySum.toLocaleString()}</span>`; dateGroupDiv.appendChild(headerDiv);

                dayRecords.forEach(item => {
                    const itemDiv = document.createElement('div'); itemDiv.className = 'history-item'; itemDiv.onclick = () => openRecordModal(item.id);
                    const icon = item.category.split(' ')[0] || '📝'; const name = item.category.substring(icon.length).trim() || item.category;
                    itemDiv.innerHTML = `
                        <div class="item-left"><div class="item-icon">${icon}</div><div class="item-info"><span class="item-category">${name}</span>${item.diary ? `<span class="item-diary">${item.diary}</span>` : ''}</div></div>
                        <div class="item-right-action-wrapper"><div class="item-amount-box"><span class="item-amount" style="color: ${item.type === 'income' ? 'var(--income-color)' : 'var(--expense-color)'}">${item.type === 'income' ? '+' : '-'}$${item.amount.toLocaleString()}</span></div><button class="list-action-delete-btn" onclick="event.stopPropagation(); openDeleteModal(${item.id})">刪除</button></div>
                    `;
                    dateGroupDiv.appendChild(itemDiv);
                });
                listContainer.appendChild(dateGroupDiv);
            });
        }
    </script>
